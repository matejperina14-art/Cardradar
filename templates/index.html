<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CardRadar – reálne ceny Pokémon kariet</title>
<meta name="description" content="Porovnaj ceny Pokémon kariet, ETB a booster boxov v slovenských obchodoch na jednom mieste.">
<meta name="theme-color" content="#090d16">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<link rel="preconnect" href="https://www.cardyx.sk" crossorigin>
<style>
:root{--bg:#090d16;--panel:#1e293b;--input:#0f172a;--text:#f8fafc;--sub:#94a3b8;--border:#334155;--accent:#facc15;--green:#4ade80;--blue:#2563eb;--warn:#fbbf24}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:22px 14px;min-height:100vh;background:linear-gradient(135deg,#090d16,#0f172a,#172033) fixed;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
.wrap{max-width:1000px;width:100%;margin:0 auto;flex:1}
h1{text-align:center;color:var(--accent);font-size:2.3rem;margin:10px 0 4px;letter-spacing:-.02em}
h1 a{color:inherit;text-decoration:none}
.sub{text-align:center;color:var(--sub);margin-bottom:22px}
.input,select,button{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:9px;padding:11px 13px;font-size:16px;font-family:inherit}
.input{outline:none}
.input:focus{border-color:#64748b}
button{cursor:pointer}
button.primary{background:var(--accent);color:#111827;font-weight:800;border:0;min-width:96px}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* search */
.search-wrap{position:relative}
.search{display:flex;gap:8px;background:#1e293bcc;padding:8px;border:1px solid var(--border);border-radius:14px}
.search input{flex:1;min-width:0}
.suggestions{position:absolute;z-index:1000;top:calc(100% + 6px);left:0;right:0;background:#111827;border:1px solid var(--border);border-radius:12px;box-shadow:0 15px 35px rgba(0,0,0,.45);display:none;max-height:430px;overflow-y:auto}
.suggestions.show{display:block}
.suggestion{display:flex;align-items:center;gap:12px;padding:8px 13px;cursor:pointer;border-bottom:1px solid rgba(51,65,85,.65)}
.suggestion:last-child{border-bottom:0}
.suggestion:hover,.suggestion.active{background:#1e293b}
.s-img{width:40px;height:52px;flex:none;border-radius:7px;background:var(--input);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden}
.s-img img{width:100%;height:100%;object-fit:contain;padding:3px}
.s-title{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-price{flex:none;color:var(--green);font-weight:800;font-size:14px}
.s-msg{padding:14px;text-align:center;color:var(--sub);font-size:14px}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0;align-items:center}
.chips button{padding:7px 10px;font-size:13px}
.chips .label{color:var(--sub);font-size:12px}
.chips .link{border:0;background:none;color:var(--sub);text-decoration:underline;padding:4px;font-size:12px}

/* status */
.notice{margin:16px 0 0;padding:10px 14px;border:1px solid #92400e;background:#451a0399;color:#fde68a;border-radius:10px;font-size:14px}
.summary{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:16px 0 10px;padding:11px 14px;background:#111827cc;border:1px solid var(--border);border-radius:10px;color:var(--sub);font-size:14px}
.summary strong{color:var(--text)}
.summary .g{color:var(--green);font-weight:800}
.summary .share{margin-left:auto;padding:6px 10px;font-size:13px}
.loading{display:flex;align-items:center;gap:10px}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px;align-items:center}
.toolbar button.on{background:var(--accent);color:#111827;border-color:var(--accent);font-weight:700}
.toolbar button,.toolbar select{padding:8px 12px;font-size:13px}
.toolbar select{margin-left:auto}
.toolbar .cnt{opacity:.65;font-weight:400;margin-left:3px}
.toolbar.shops{margin-bottom:12px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:flex;flex-direction:column;background:#1e293bcc;border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:transform .15s,border-color .15s;content-visibility:auto;contain-intrinsic-size:auto 420px}
.card:hover{transform:translateY(-2px);border-color:#64748b}
.card.best{border-color:#16a34a}
.c-img{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;background:var(--input);text-decoration:none;font-size:42px}
.c-img img{width:100%;height:100%;object-fit:contain;padding:8px;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.c-img.wait{background:linear-gradient(90deg,#0f172a,#1b2740,#0f172a);background-size:200% 100%;animation:sh 1.2s infinite}
.c-body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.c-title{font-weight:700;line-height:1.3;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:11px;background:#334155;padding:3px 7px;border-radius:5px}
.b-best{background:#16a34a}.b-card{background:var(--blue)}.b-prod{background:#7c3aed}
.c-foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.price{font-size:1.25rem;color:var(--green);font-weight:800;white-space:nowrap;line-height:1.15}
.price small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.price.none{color:var(--sub);font-size:.95rem;font-weight:600}
.buy{background:var(--accent);color:#111827;text-decoration:none;font-weight:800;padding:7px 10px;border-radius:7px;font-size:13px;white-space:nowrap}

/* skeleton */
.sk{background:#1e293bcc;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.sk i{display:block;background:linear-gradient(90deg,#1e293b,#2b3a52,#1e293b);background-size:200% 100%;animation:sh 1.2s infinite}
.sk .a{aspect-ratio:3/4}.sk .b{height:14px;margin:12px;border-radius:6px}.sk .c{height:14px;width:50%;margin:0 12px 14px;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}

.panel{background:#1e293bcc;border:1px solid var(--border);border-radius:14px;padding:16px;margin:14px 0}
.error{color:#fda4af}
.empty{text-align:center;padding:30px;color:var(--sub);line-height:1.5}
.empty button{margin-top:10px;padding:8px 12px;font-size:13px}

footer{max-width:1000px;width:100%;margin:40px auto 0;padding:18px 4px 4px;border-top:1px solid var(--border);color:var(--sub);font-size:13px;line-height:1.6;text-align:center}
footer a{color:var(--sub)}

@media(max-width:650px){
  body{padding:16px 10px}
  h1{font-size:2rem}
  .search{flex-direction:column}
  .search button{width:100%}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .c-foot{flex-direction:column;align-items:stretch}
  .buy{text-align:center}
  .toolbar select{margin-left:0;width:100%}
  .toolbar.shops{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .toolbar.shops button{flex:none}
  .summary .share{margin-left:0}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <h1><a href="/" id="home">CardRadar 🔍</a></h1>
  <div class="sub" id="sub">Reálne ceny Pokémon kariet zo slovenských obchodov</div>

  <div class="search-wrap">
    <div class="search" role="search">
      <input id="q" class="input" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             aria-label="Hľadaná karta alebo produkt" aria-controls="suggestions" placeholder="Pikachu, Charizard, Surging Sparks ETB...">
      <button id="searchButton" class="primary">Hľadať</button>
    </div>
    <div id="suggestions" class="suggestions" role="listbox"></div>
  </div>

  <div class="chips" id="tags"></div>
  <div class="chips" id="recent"></div>

  <div id="status" aria-live="polite"></div>
  <div id="toolbar"></div>
  <div id="results"></div>
</div>

<footer id="footer">
  Ceny sú orientačné a načítavajú sa priamo z obchodov. Pred nákupom ich over na stránke predajcu.<br>
  CardRadar nie je obchod – tlačidlo „Otvoriť“ ťa presmeruje k predajcovi.
</footer>

<script>
/* CARD RADAR FRONTEND 5.26 */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const num = v => { const n = Number(v); return v !== null && v !== undefined && v !== '' && Number.isFinite(n) ? n : null; };
const priceOf = i => num(i?.price_eur ?? i?.price);
const imageOf = i => String(i?.image || i?.image_url || '').trim();
const plural = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4 ? few : many);

let CZK_RATE = 24.4618;
let SHOPS = [];
const eurFmt = new Intl.NumberFormat('sk-SK', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const czkFmt = new Intl.NumberFormat('cs-CZ', {maximumFractionDigits: 0});
const eur = n => num(n) === null ? '–' : eurFmt.format(n) + ' €';
const czk = n => num(n) === null ? '' : czkFmt.format(Math.round(n * CZK_RATE)) + ' Kč';

const QUICK = ['Charizard VMAX','Pikachu ex','Surging Sparks ETB','Umbreon VMAX','Pokémon 151 ETB','Booster Box'];
const LOCAL = ['Pikachu','Charizard','Umbreon','Eevee','Mew','Mewtwo','Gengar','Lucario','Greninja','Rayquaza','Gardevoir','Dragonite','Gyarados','Blastoise','Venusaur','Lugia','Ho-Oh','Arceus','Dialga','Palkia','Zekrom','Reshiram','Celebi','Jolteon','Vaporeon','Flareon','Espeon','Sylveon','Leafeon','Glaceon'];
const DEBOUNCE = 350, MIN_CHARS = 3, SUG_TTL = 60000, RES_TTL = 120000, IMG_CHUNK = 12, IMG_MAX = 48;

/* ---------- config (obchody, kurz) ---------- */
fetch('/api/config').then(r => r.ok ? r.json() : null).then(c => {
  if (!c) return;
  if (num(c.czk_per_eur)) CZK_RATE = c.czk_per_eur;
  SHOPS = Array.isArray(c.shops) ? c.shops : [];
  if (!SHOPS.length) return;
  const n = SHOPS.length;
  $('sub').textContent = `Reálne ceny Pokémon kariet z ${n} ${plural(n,'obchodu','obchodov','obchodov')} na jednom mieste`;
  $('footer').innerHTML =
    'Prehľadávame: ' + SHOPS.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a>`).join(', ') + '.<br>' +
    'Ceny sú orientačné a načítavajú sa priamo z obchodov. Pred nákupom ich over na stránke predajcu. ' +
    `Prepočet: 1 € = ${String(CZK_RATE).replace('.', ',')} Kč.<br>` +
    'CardRadar nie je obchod – tlačidlo „Otvoriť“ ťa presmeruje k predajcovi.';
}).catch(() => {});

/* ---------- quick tags + recent ---------- */
$('tags').innerHTML = QUICK.map(t => `<button data-q="${esc(t)}">${esc(t)}</button>`).join('');

function getRecent(){ try { return JSON.parse(localStorage.getItem('cr_recent') || '[]'); } catch(e){ return []; } }
function setRecent(a){ try { localStorage.setItem('cr_recent', JSON.stringify(a)); } catch(e){} }
function addRecent(q){ setRecent([q, ...getRecent().filter(x => x.toLowerCase() !== q.toLowerCase())].slice(0,6)); renderRecent(); }
function renderRecent(){
  const r = getRecent();
  $('recent').innerHTML = r.length
    ? '<span class="label">Naposledy:</span>' + r.map(t => `<button data-q="${esc(t)}">🕘 ${esc(t)}</button>`).join('') + '<button class="link" id="clearRecent">vymazať</button>'
    : '';
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-q]');
  if (b) { search(b.dataset.q); return; }
  if (e.target.id === 'clearRecent') { setRecent([]); renderRecent(); }
  if (e.target.closest('#shareBtn')) share();
  if (e.target.closest('#resetFilters')) { typeFilter = 'all'; shopFilter = 'all'; renderView(); }
  if (!e.target.closest('.search-wrap')) hideSug();
});
renderRecent();

/* ---------- autocomplete ---------- */
let sugTimer = null, sugItems = [], sugIndex = -1, sugCtrl = null, gen = 0;
const sugCache = new Map();

function localSuggestions(q){
  q = q.toLowerCase();
  const out = [];
  for (const p of LOCAL) {
    const l = p.toLowerCase();
    if (l.startsWith(q) || q.startsWith(l)) {
      out.push({title:p, query:p, type:'pokemon'});
      for (const s of ['ex','VMAX','VSTAR','V']) {
        const t = p + ' ' + s;
        if (t.toLowerCase().startsWith(q)) out.push({title:t, query:t, type:'card'});
      }
    }
  }
  return out.slice(0,8);
}

function abortSug(){ if (sugCtrl) { sugCtrl.abort(); sugCtrl = null; } clearTimeout(sugTimer); }

$('q').addEventListener('input', () => {
  const q = $('q').value.trim();
  gen++; const g = gen;
  abortSug(); sugIndex = -1;
  if (q.length < MIN_CHARS) { hideSug(); return; }

  const c = sugCache.get(q.toLowerCase());
  if (c && Date.now() - c.t < SUG_TTL) { sugItems = c.items; renderSug(); return; }

  sugItems = localSuggestions(q);
  sugItems.length ? renderSug() : showMsg('🔎 Hľadám konkrétne karty...');
  sugTimer = setTimeout(() => loadSug(q, g), DEBOUNCE);
});

async function loadSug(q, g){
  const key = q.toLowerCase();
  sugCtrl = new AbortController();
  try {
    const r = await fetch('/api/suggestions?q=' + encodeURIComponent(q), {signal: sugCtrl.signal});
    const data = r.ok ? await r.json() : {};
    if (g !== gen) return;
    const items = (data.suggestions || []).filter(s => s && s.title && s.query).slice(0,8);
    if (r.ok) sugCache.set(key, {t: Date.now(), items: items.length ? items : localSuggestions(q)});
    sugItems = items.length ? items : localSuggestions(q);
    sugIndex = -1;
    sugItems.length ? renderSug() : showMsg('Žiadny návrh. Stlač Enter a hľadaj.');
  } catch (e) {
    if (e.name === 'AbortError' || g !== gen) return;
    sugItems = localSuggestions(q);
    sugItems.length ? renderSug() : hideSug();
  }
}

function showMsg(t){ $('suggestions').innerHTML = `<div class="s-msg">${t}</div>`; $('suggestions').classList.add('show'); }
function hideSug(){ $('suggestions').classList.remove('show'); $('suggestions').innerHTML = ''; sugItems = []; sugIndex = -1; }

function renderSug(){
  $('suggestions').innerHTML = sugItems.map((s,i) => {
    const img = imageOf(s), p = priceOf(s);
    const icon = s.type === 'product' ? '📦' : s.type === 'pokemon' ? '⚡' : '🃏';
    return `<div class="suggestion" role="option" data-i="${i}">
      <div class="s-img">${img ? `<img src="${esc(img)}" alt="" loading="lazy" decoding="async" onerror="this.replaceWith('${icon}')">` : icon}</div>
      <div class="s-title">${esc(s.title)}</div>
      <div class="s-price">${p !== null ? eur(p) : ''}</div></div>`;
  }).join('');
  $('suggestions').classList.add('show');
  markActive();
}
function markActive(){
  document.querySelectorAll('.suggestion').forEach((r,i) => r.classList.toggle('active', i === sugIndex));
  const a = document.querySelector('.suggestion.active'); if (a) a.scrollIntoView({block:'nearest'});
}
$('suggestions').addEventListener('click', e => {
  const r = e.target.closest('.suggestion'); if (r) pick(sugItems[+r.dataset.i]);
});
function pick(item){ if (item) search(item.query || item.title); }

$('q').addEventListener('keydown', e => {
  const open = $('suggestions').classList.contains('show') && sugItems.length;
  if (e.key === 'ArrowDown' && open) { e.preventDefault(); sugIndex = (sugIndex + 1) % sugItems.length; markActive(); }
  else if (e.key === 'ArrowUp' && open) { e.preventDefault(); sugIndex = (sugIndex - 1 + sugItems.length) % sugItems.length; markActive(); }
  else if (e.key === 'Enter') { e.preventDefault(); open && sugIndex >= 0 ? pick(sugItems[sugIndex]) : search(); }
  else if (e.key === 'Escape') hideSug();
});
$('searchButton').addEventListener('click', () => search());

/* ---------- state ---------- */
let allResults = [], typeFilter = 'all', shopFilter = 'all', sortMode = 'asc';
let currentQuery = '', failedShops = [], resultsGen = 0;
let searchCtrl = null;
const resCache = new Map();

const PRODUCT_RE = /elite trainer box|\betb\b|booster box|booster bundle|collection box|premium collection|blister|\btins?\b/i;

function visible(){
  return allResults
    .filter(i => (typeFilter === 'all' || (typeFilter === 'product') === i._p)
              && (shopFilter === 'all' || i.shop === shopFilter))
    .sort((a,b) => {
      const pa = priceOf(a), pb = priceOf(b);
      if (pa === null && pb === null) return 0;
      if (pa === null) return 1;
      if (pb === null) return -1;
      return sortMode === 'asc' ? pa - pb : pb - pa;
    });
}

/* ---------- rendering ---------- */
function skeleton(){
  $('results').innerHTML = '<div class="grid">' + '<div class="sk"><i class="a"></i><i class="b"></i><i class="c"></i></div>'.repeat(8) + '</div>';
}

function renderStatus(list){
  let h = '';
  if (failedShops.length) {
    const many = failedShops.length > 1;
    h += `<div class="notice">⚠️ ${esc(failedShops.join(', '))} teraz ${many ? 'neodpovedajú' : 'neodpovedá'}, ponuky z ${many ? 'nich' : 'neho'} môžu chýbať. Skús hľadať znova o chvíľu.</div>`;
  }
  if (allResults.length) {
    const prices = list.map(priceOf).filter(p => p !== null);
    const low = prices.length ? Math.min(...prices) : null;
    const avg = prices.length ? prices.reduce((a,b) => a + b, 0) / prices.length : null;
    const shopsN = new Set(list.map(i => i.shop)).size;
    h += `<div class="summary"><strong>${esc(currentQuery)}</strong>
      <span>${list.length} ${plural(list.length,'ponuka','ponuky','ponúk')} v ${shopsN} ${plural(shopsN,'obchode','obchodoch','obchodoch')}</span>` +
      (low !== null ? `<span>od <span class="g">${eur(low)}</span></span><span>priemer <span class="g">${eur(avg)}</span></span>` : '') +
      `<button class="share" id="shareBtn">🔗 Zdieľať</button></div>`;
  }
  $('status').innerHTML = h;
}

function renderToolbar(){
  if (!allResults.length) { $('toolbar').innerHTML = ''; return; }
  const inShop = allResults.filter(i => shopFilter === 'all' || i.shop === shopFilter);
  const nCard = inShop.filter(i => !i._p).length, nProd = inShop.length - nCard;
  const tb = (k, label, n) => `<button data-f="${k}" class="${typeFilter === k ? 'on' : ''}" aria-pressed="${typeFilter === k}">${label}<span class="cnt">${n}</span></button>`;

  const shopCounts = {};
  allResults.filter(i => typeFilter === 'all' || (typeFilter === 'product') === i._p)
            .forEach(i => shopCounts[i.shop] = (shopCounts[i.shop] || 0) + 1);
  const shopNames = [...new Set(allResults.map(i => i.shop))];
  const sb = (k, label, n) => `<button data-s="${esc(k)}" class="${shopFilter === k ? 'on' : ''}" aria-pressed="${shopFilter === k}">${esc(label)}<span class="cnt">${n}</span></button>`;

  $('toolbar').innerHTML =
    `<div class="toolbar">${tb('all','Všetko',inShop.length)}${tb('card','Karty',nCard)}${tb('product','Produkty',nProd)}
      <select id="sortSel" aria-label="Zoradenie">
        <option value="asc"${sortMode==='asc'?' selected':''}>Najlacnejšie</option>
        <option value="desc"${sortMode==='desc'?' selected':''}>Najdrahšie</option>
      </select></div>` +
    (shopNames.length > 1
      ? `<div class="toolbar shops">${sb('all','Všetky obchody', Object.values(shopCounts).reduce((a,b)=>a+b,0))}${shopNames.map(s => sb(s, s, shopCounts[s] || 0)).join('')}</div>`
      : '');
}
$('toolbar').addEventListener('click', e => {
  const f = e.target.closest('[data-f]');
  if (f) { typeFilter = f.dataset.f; renderView(); return; }
  const s = e.target.closest('[data-s]');
  if (s) { shopFilter = s.dataset.s; renderView(); }
});
$('toolbar').addEventListener('change', e => {
  if (e.target.id === 'sortSel') { sortMode = e.target.value; renderView(); }
});

function imgHtml(x){
  const img = imageOf(x);
  if (img) return `<img src="${esc(img)}" alt="${esc(x.title)}" loading="lazy" decoding="async" onerror="this.replaceWith('🃏')">`;
  return x._imgPending ? '' : '🃏';
}

function cardHtml(x, best){
  const p = priceOf(x);
  const link = x.link ? esc(x.link) : '';
  const waitCls = !imageOf(x) && x._imgPending ? ' wait' : '';
  const img = link
    ? `<a class="c-img${waitCls}" href="${link}" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-hidden="true">${imgHtml(x)}</a>`
    : `<div class="c-img${waitCls}">${imgHtml(x)}</div>`;
  return `<div class="card${best ? ' best' : ''}" data-k="${x._k}">
    ${img}
    <div class="c-body">
      <div class="c-title">${esc(x.title)}</div>
      <div class="badges">
        <span class="badge ${x._p ? 'b-prod' : 'b-card'}">${x._p ? 'Produkt' : 'Karta'}</span>
        ${x.shop ? `<span class="badge">${esc(x.shop)}</span>` : ''}
        ${x.country ? `<span class="badge">${esc(x.country)}</span>` : ''}
        ${x.language ? `<span class="badge">${esc(x.language)}</span>` : ''}
        ${x.condition ? `<span class="badge">${esc(x.condition)}</span>` : ''}
        ${best ? '<span class="badge b-best">Najnižšia cena</span>' : ''}
      </div>
      <div class="c-foot">
        <div class="price${p === null ? ' none' : ''}">${p === null ? 'Cena nezistená' : eur(p) + `<small>≈ ${czk(p)}</small>`}</div>
        ${link ? `<a class="buy" href="${link}" target="_blank" rel="noopener noreferrer">Otvoriť ↗</a>` : ''}
      </div>
    </div></div>`;
}

function renderGrid(list){
  if (!allResults.length) {
    $('results').innerHTML = `<div class="empty">Pre „${esc(currentQuery)}“ sme nenašli žiadnu ponuku.<br>
      Skús kratší názov (napr. len meno Pokémona) alebo iný set.</div>`;
    return;
  }
  if (!list.length) {
    $('results').innerHTML = '<div class="empty">Pre zvolený filter nie sú žiadne ponuky.<br><button id="resetFilters">Zobraziť všetko</button></div>';
    return;
  }
  const prices = list.map(priceOf).filter(p => p !== null);
  const cheapest = prices.length ? Math.min(...prices) : null;
  $('results').innerHTML = '<div class="grid">' + list.map(x => cardHtml(x, cheapest !== null && priceOf(x) === cheapest)).join('') + '</div>';
}

function renderView(){
  const list = visible();
  renderStatus(list);
  renderToolbar();
  renderGrid(list);
}

/* ---------- lazy obrázky ---------- */
function paintImage(x){
  const el = document.querySelector(`.card[data-k="${x._k}"] .c-img`);
  if (!el) return;
  el.classList.remove('wait');
  el.innerHTML = imgHtml(x);
}

async function loadMissingImages(myGen){
  const items = allResults.filter(x => !imageOf(x) && x.link && !x._imgTried).slice(0, IMG_MAX);
  if (!items.length) return;
  items.forEach(x => { x._imgTried = true; x._imgPending = true; });
  // najprv obrázky z aktuálne viditeľného poradia
  const order = new Map(visible().map((x, i) => [x._k, i]));
  items.sort((a, b) => (order.get(a._k) ?? 1e9) - (order.get(b._k) ?? 1e9));
  if (myGen === resultsGen) items.forEach(x => { const el = document.querySelector(`.card[data-k="${x._k}"] .c-img`); if (el) { el.classList.add('wait'); el.textContent = ''; } });

  const chunks = [];
  for (let i = 0; i < items.length; i += IMG_CHUNK) chunks.push(items.slice(i, i + IMG_CHUNK));

  await Promise.all(chunks.map(async chunk => {
    try {
      const r = await fetch('/api/images', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({links: chunk.map(x => x.link)})
      });
      const d = r.ok ? await r.json() : {};
      const m = d.images || {};
      for (const x of chunk) { if (m[x.link]) x.image = m[x.link]; }
    } catch (e) {}
    for (const x of chunk) {
      x._imgPending = false;
      if (myGen === resultsGen) paintImage(x);
    }
  }));
}

/* ---------- zdieľanie + URL ---------- */
function shareUrl(){ return location.origin + location.pathname + '?q=' + encodeURIComponent(currentQuery); }
async function share(){
  const url = shareUrl(), btn = $('shareBtn');
  try {
    if (navigator.share) { await navigator.share({title: currentQuery + ' – CardRadar', url}); return; }
    await navigator.clipboard.writeText(url);
    if (btn) { btn.textContent = '✓ Odkaz skopírovaný'; setTimeout(() => { if ($('shareBtn')) $('shareBtn').textContent = '🔗 Zdieľať'; }, 2000); }
  } catch (e) {
    if (e.name !== 'AbortError') prompt('Skopíruj odkaz:', url);
  }
}
function updateUrl(q, push){
  document.title = q + ' – CardRadar';
  if (new URLSearchParams(location.search).get('q') === q) return;
  const url = location.pathname + '?q=' + encodeURIComponent(q);
  push ? history.pushState({q}, '', url) : history.replaceState({q}, '', url);
}
function resetView(){
  if (searchCtrl) { searchCtrl.abort(); searchCtrl = null; }
  resultsGen++; allResults = []; currentQuery = ''; failedShops = [];
  $('q').value = ''; $('status').innerHTML = ''; $('toolbar').innerHTML = ''; $('results').innerHTML = '';
  $('searchButton').disabled = false;
  document.title = 'CardRadar – reálne ceny Pokémon kariet';
}
window.addEventListener('popstate', () => {
  const q = new URLSearchParams(location.search).get('q');
  q ? search(q, {push: false}) : resetView();
});
$('home').addEventListener('click', e => {
  e.preventDefault();
  if (location.search) history.pushState({}, '', location.pathname);
  resetView(); $('q').focus();
});

/* ---------- search ---------- */
function showData(q, data, push){
  const norm = (data.normalized_query || '').trim() || q;
  $('q').value = norm;
  if (num(data.czk_per_eur)) CZK_RATE = data.czk_per_eur;

  resultsGen++;
  currentQuery = norm;
  allResults = Array.isArray(data.results) ? data.results : [];
  allResults.forEach((x, i) => { x._k = i; x._p = PRODUCT_RE.test(x.title || ''); });
  failedShops = (data.shops || []).filter(s => s.ok === false).map(s => s.name);
  typeFilter = 'all'; shopFilter = 'all';

  updateUrl(norm, push);
  renderView();
  if (allResults.length) addRecent(norm);
  loadMissingImages(resultsGen);
}

async function search(qArg, opts = {}){
  gen++; abortSug(); hideSug();
  const q = String(qArg ?? $('q').value).trim();
  if (!q) { $('q').focus(); return; }
  $('q').value = q;
  const push = opts.push !== false;

  if (searchCtrl) searchCtrl.abort();
  const key = q.toLowerCase();
  const c = resCache.get(key);
  if (c && Date.now() - c.t < RES_TTL) { showData(q, c.data, push); return; }

  const ctrl = searchCtrl = new AbortController();
  const btn = $('searchButton');
  btn.disabled = true;
  const n = SHOPS.length;
  $('status').innerHTML = `<div class="summary loading"><span class="spin"></span>Prehľadávam ${n ? n + ' ' + plural(n,'obchod','obchody','obchodov') : 'obchody'}…</div>`;
  $('toolbar').innerHTML = '';
  skeleton();
  if (window.innerWidth < 650) $('q').blur();

  try {
    const r = await fetch('/api/search?q=' + encodeURIComponent(q), {signal: ctrl.signal});
    const text = await r.text();
    let data;
    try { data = JSON.parse(text); }
    catch (e) { throw new Error('Server neodpovedal správne (HTTP ' + r.status + '). Skús to znova.'); }
    if (!r.ok) throw new Error(data.error || 'Vyhľadávanie zlyhalo. Skús to znova.');

    const entry = {t: Date.now(), data};
    resCache.set(key, entry);
    const nk = (data.normalized_query || '').trim().toLowerCase();
    if (nk) resCache.set(nk, entry);
    if (resCache.size > 50) resCache.delete(resCache.keys().next().value);

    showData(q, data, push);
  } catch (e) {
    if (e.name === 'AbortError') return;
    allResults = [];
    $('toolbar').innerHTML = '';
    $('results').innerHTML = '';
    $('status').innerHTML = `<div class="panel error"><b>Chyba:</b> ${esc(e.message || 'Neznáma chyba.')}</div>`;
  } finally {
    if (searchCtrl === ctrl) { searchCtrl = null; btn.disabled = false; }
  }
}

/* ---------- ?q= v URL ---------- */
try {
  const iq = new URLSearchParams(location.search).get('q');
  if (iq) search(iq, {push: false});
} catch (e) {}
</script>
