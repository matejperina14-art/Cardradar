<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CardRadar 🔍 – reálne ceny Pokémon kariet</title>

<style>
:root{
  --bg:#090d16;
  --panel:#1e293b;
  --input:#0f172a;
  --text:#f8fafc;
  --sub:#94a3b8;
  --border:#334155;
  --accent:#facc15;
  --green:#4ade80;
  --blue:#2563eb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:22px 14px;
  min-height:100vh;
  background:
    linear-gradient(135deg,#090d16,#0f172a,#172033);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.wrap{
  max-width:900px;
  margin:auto;
}

h1{
  text-align:center;
  color:var(--accent);
  font-size:2.3rem;
  margin:10px 0 4px;
}

.sub{
  text-align:center;
  color:var(--sub);
  margin-bottom:22px;
}

/* SEARCH */

.search-wrap{
  position:relative;
}

.search{
  display:flex;
  gap:8px;
  background:#1e293bcc;
  padding:8px;
  border:1px solid var(--border);
  border-radius:14px;
}

.search input{
  flex:1;
}

.input,
select,
button{
  border:1px solid var(--border);
  background:var(--input);
  color:var(--text);
  border-radius:9px;
  padding:11px 13px;
  font-size:15px;
}

.input{
  outline:none;
}

.input:focus{
  border-color:#64748b;
  box-shadow:0 0 0 2px rgba(100,116,139,.15);
}

button{
  cursor:pointer;
}

button.primary{
  background:var(--accent);
  color:#111827;
  font-weight:800;
  border:0;
}

button.primary:disabled{
  opacity:.6;
  cursor:default;
}

/* AUTOCOMPLETE */

.suggestions{
  position:absolute;
  z-index:1000;
  top:calc(100% + 6px);
  left:0;
  right:0;
  background:#111827;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 15px 35px rgba(0,0,0,.45);
  display:none;
  max-height:430px;
  overflow-y:auto;
}

.suggestions.show{
  display:block;
}

.suggestion{
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 13px;
  cursor:pointer;
  border-bottom:1px solid rgba(51,65,85,.65);
  min-height:68px;
}

.suggestion:last-child{
  border-bottom:0;
}

.suggestion:hover,
.suggestion.active{
  background:#1e293b;
}

.suggestion-image-wrap{
  width:44px;
  height:56px;
  flex:none;
  border-radius:7px;
  overflow:hidden;
  background:#0f172a;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
}

.suggestion-image{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:3px;
  display:block;
}

.suggestion-image-placeholder{
  font-size:20px;
  opacity:.75;
}

.suggestion-main{
  min-width:0;
  flex:1;
}

.suggestion-title{
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.3;
}

.suggestion-sub{
  color:var(--sub);
  font-size:12px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.suggestion-price-wrap{
  flex:none;
  min-width:90px;
  text-align:right;
  display:flex;
  justify-content:flex-end;
  align-items:center;
}

.suggestion-price{
  color:var(--green);
  font-size:14px;
  font-weight:800;
  white-space:nowrap;
}

.suggestions-loading,
.suggestions-empty{
  padding:14px;
  text-align:center;
  color:var(--sub);
  font-size:14px;
}

/* TAGS */

.tags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:12px 0;
}

.tags button{
  padding:7px 10px;
  font-size:13px;
}

/* PANELS */

.panel{
  background:#1e293bcc;
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin:14px 0;
}

/* SUMMARY */

.result-summary{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  margin:14px 0 10px;
  padding:11px 14px;
  background:#111827cc;
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--sub);
  font-size:14px;
}

.result-summary strong{
  color:var(--text);
}

.result-summary .summary-price{
  color:var(--green);
  font-weight:800;
}

.result-summary .separator{
  color:#475569;
}

/* OFFERS */

.offers-panel{
  background:#1e293bcc;
  border:1px solid var(--border);
  border-radius:14px;
  padding:0 16px;
  margin:10px 0 14px;
}

.offers-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:14px 0 10px;
  border-bottom:1px solid var(--border);
}

.offers-heading-title{
  font-size:17px;
  font-weight:800;
}

.offers-heading-sub{
  color:var(--sub);
  font-size:12px;
}

/* OFFER */

.offer{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--border);
}

.offer:last-child{
  border-bottom:0;
}

.offer-image-wrap{
  width:88px;
  height:108px;
  flex:none;
  border-radius:10px;
  overflow:hidden;
  background:#0f172a;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
}

.offer-image-link{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
}

.offer-image{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  padding:5px;
}

.offer-image-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:5px;
  color:var(--sub);
  font-size:11px;
  text-align:center;
}

.offer-image-placeholder-icon{
  font-size:26px;
  opacity:.75;
}

.offer-main{
  min-width:0;
  flex:1;
}

.offer-title{
  font-weight:700;
  line-height:1.35;
  word-break:break-word;
}

.offer-meta{
  margin-top:6px;
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

.offer-price{
  flex:none;
  text-align:right;
  min-width:120px;
}

.price{
  font-size:1.3rem;
  color:var(--green);
  font-weight:800;
  white-space:nowrap;
}

.price-missing{
  color:var(--sub);
  font-size:1rem;
  font-weight:600;
}

.buy{
  display:inline-block;
  margin-top:7px;
  background:var(--accent);
  color:#111827;
  text-decoration:none;
  font-weight:800;
  padding:7px 10px;
  border-radius:7px;
  font-size:13px;
}

/* BADGES */

.badge{
  font-size:12px;
  background:#334155;
  padding:3px 7px;
  border-radius:5px;
}

.best{
  background:#16a34a;
  color:white;
}

.type-card{
  background:#2563eb;
  color:white;
}

.type-product{
  background:#7c3aed;
  color:white;
}

/* STATES */

.loading{
  text-align:center;
  padding:30px;
  color:var(--sub);
}

.error{
  color:#fda4af;
}

.empty{
  text-align:center;
  padding:30px;
  color:var(--sub);
}

/* MOBILE */

@media(max-width:650px){

  body{
    padding:16px 10px;
  }

  h1{
    font-size:2rem;
  }

  .search{
    flex-direction:column;
  }

  .search button{
    width:100%;
  }

  .offer{
    display:grid;
    grid-template-columns:76px minmax(0,1fr);
    gap:11px;
    align-items:start;
  }

  .offer-image-wrap{
    width:76px;
    height:96px;
  }

  .offer-price{
    grid-column:1 / -1;
    width:100%;
    text-align:left;
    min-width:0;
    padding-left:87px;
  }

  .suggestion{
    gap:9px;
    padding:8px 10px;
    min-height:64px;
  }

  .suggestion-image-wrap{
    width:40px;
    height:50px;
  }

  .suggestion-price-wrap{
    min-width:72px;
  }

  .suggestion-price{
    font-size:12px;
  }

  .offers-panel{
    padding:0 12px;
  }

  .offers-heading{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>CardRadar 🔍</h1>

<div class="sub">
  Reálne ceny Pokémon kariet a produktov z CardyX
</div>

<div class="search-wrap">

  <div class="search">

    <input
      id="q"
      class="input"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Pikachu, Charizard, Surging Sparks ETB..."
      oninput="handleInput()"
      onkeydown="handleKeydown(event)"
    >

    <button
      id="searchButton"
      class="primary"
      onclick="search()"
    >
      Hľadať
    </button>

  </div>

  <div id="suggestions" class="suggestions"></div>

</div>

<div class="tags">

  <button onclick="tag('Charizard VMAX')">
    Charizard VMAX
  </button>

  <button onclick="tag('Pikachu ex')">
    Pikachu ex
  </button>

  <button onclick="tag('Surging Sparks ETB')">
    Surging Sparks ETB
  </button>

  <button onclick="tag('Umbreon VMAX')">
    Umbreon VMAX
  </button>

  <button onclick="tag('Pokémon 151 ETB')">
    Pokémon 151 ETB
  </button>

  <button onclick="tag('Booster Box')">
    Booster Box
  </button>

</div>

<div id="status"></div>
<div id="results"></div>

</div>

<script>

/* =========================================================
   CARD RADAR FRONTEND 5.23
========================================================= */

const eur = n => {

  const value = Number(n);

  if(!Number.isFinite(value)){
    return '-';
  }

  return value.toFixed(2) + ' €';
};


/* =========================================================
   PRICE
========================================================= */

function parsePriceValue(value){

  if(
    value === null ||
    value === undefined ||
    value === ''
  ){
    return null;
  }

  if(typeof value === 'number'){
    return Number.isFinite(value)
      ? value
      : null;
  }

  let text =
    String(value)
      .trim()
      .replace(/\s/g,'')
      .replace(',', '.');

  text =
    text.replace(/[^0-9.]/g,'');

  if(!text){
    return null;
  }

  const dots =
    (text.match(/\./g) || []).length;

  if(dots > 1){

    const parts =
      text.split('.');

    const decimal =
      parts.pop();

    text =
      parts.join('') +
      '.' +
      decimal;
  }

  const number =
    Number(text);

  return Number.isFinite(number)
    ? number
    : null;
}


function getResultPrice(item){

  if(!item){
    return null;
  }

  const fields = [

    'price_eur',
    'priceEUR',
    'eur',
    'eur_price',
    'eurPrice',
    'price',
    'amount',
    'value',
    'current_price',
    'currentPrice',
    'price_value',
    'priceValue',
    'lowest_price',
    'lowestPrice',
    'min_price',
    'minPrice',
    'sale_price',
    'salePrice'

  ];

  for(const field of fields){

    if(
      item[field] !== undefined &&
      item[field] !== null &&
      item[field] !== ''
    ){

      const parsed =
        parsePriceValue(item[field]);

      if(parsed !== null){
        return parsed;
      }
    }
  }

  const textFields = [

    'price_text',
    'priceText',
    'price_label',
    'priceLabel',
    'formatted_price',
    'formattedPrice',
    'display_price',
    'displayPrice'

  ];

  for(const field of textFields){

    if(
      item[field] !== undefined &&
      item[field] !== null
    ){

      const parsed =
        parsePriceValue(item[field]);

      if(parsed !== null){
        return parsed;
      }
    }
  }

  return null;
}


/* =========================================================
   IMAGE
========================================================= */

function getResultImage(item){

  if(!item){
    return '';
  }

  const fields = [

    'image',
    'image_url',
    'imageUrl',
    'thumbnail',
    'thumbnail_url',
    'thumbnailUrl',
    'img',
    'img_url',
    'imgUrl',
    'picture',
    'picture_url',
    'pictureUrl',
    'photo',
    'photo_url',
    'photoUrl'

  ];

  for(const field of fields){

    if(
      item[field] !== undefined &&
      item[field] !== null &&
      String(item[field]).trim()
    ){

      return String(item[field]).trim();
    }
  }

  return '';
}


/* =========================================================
   ESCAPE
========================================================= */

function esc(s){

  return String(s ?? '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );
}


/* =========================================================
   AUTOCOMPLETE
========================================================= */

let suggestionTimer = null;
let suggestionItems = [];
let suggestionIndex = -1;
let suggestionController = null;
let searchGeneration = 0;

const suggestionCache = new Map();

const SUGGESTION_CACHE_TTL = 30000;


/* =========================================================
   LOCAL CATALOG
========================================================= */

const pokemonCatalog = [

  'Pikachu',
  'Charizard',
  'Umbreon',
  'Eevee',
  'Mew',
  'Mewtwo',
  'Gengar',
  'Lucario',
  'Greninja',
  'Rayquaza',
  'Gardevoir',
  'Dragonite',
  'Gyarados',
  'Blastoise',
  'Venusaur',
  'Lugia',
  'Ho-Oh',
  'Arceus',
  'Dialga',
  'Palkia',
  'Zekrom',
  'Reshiram',
  'Celebi',
  'Jolteon',
  'Vaporeon',
  'Flareon',
  'Espeon',
  'Sylveon',
  'Leafeon',
  'Glaceon'

];


function buildLocalSuggestions(q){

  const query =
    q.toLowerCase().trim();

  if(query.length < 2){
    return [];
  }

  const results = [];

  for(const pokemon of pokemonCatalog){

    const p =
      pokemon.toLowerCase();

    if(
      p.startsWith(query) ||
      query.startsWith(p)
    ){

      results.push({
        title:pokemon,
        query:pokemon,
        subtitle:'Pokémon karta',
        type:'pokemon',
        type_label:'Pokémon',
        image:'',
        price_eur:null
      });

      for(const suffix of [
        'ex',
        'VMAX',
        'VSTAR',
        'V'
      ]){

        const title =
          pokemon + ' ' + suffix;

        if(
          title.toLowerCase().startsWith(query) ||
          query === p
        ){

          results.push({
            title:title,
            query:title,
            subtitle:'Pokémon karta',
            type:'card',
            type_label:'Karta',
            image:'',
            price_eur:null
          });
        }
      }
    }
  }

  return results;
}


/* =========================================================
   NORMALIZE SERVER RESULT
========================================================= */

function normalizeSuggestion(item){

  if(!item){
    return null;
  }

  const title =
    String(
      item.title ||
      item.name ||
      item.product_name ||
      item.productName ||
      item.query ||
      ''
    ).trim();

  const query =
    String(
      item.query ||
      item.search_query ||
      item.searchQuery ||
      item.title ||
      item.name ||
      item.product_name ||
      item.productName ||
      ''
    ).trim();

  if(!title || !query){
    return null;
  }

  return {

    ...item,

    title:title,

    query:query,

    subtitle:
      item.subtitle ||
      item.description ||
      '',

    image:
      getResultImage(item),

    price_eur:
      getResultPrice(item)

  };
}


/* =========================================================
   MERGE
========================================================= */

function mergeSuggestions(serverItems, localItems){

  const merged = [];
  const seen = new Set();

  function add(item){

    const normalized =
      normalizeSuggestion(item);

    if(!normalized){
      return;
    }

    /*
       Reálne serverové karty identifikujeme
       prednostne podľa linku.
    */

    const key =
      normalized.link
        ? 'link:' + normalized.link.toLowerCase()
        : 'query:' + normalized.query.toLowerCase();

    if(seen.has(key)){
      return;
    }

    seen.add(key);

    merged.push(normalized);
  }

  if(Array.isArray(serverItems)){
    serverItems.forEach(add);
  }

  if(Array.isArray(localItems)){
    localItems.forEach(add);
  }

  return merged.slice(0,8);
}


/* =========================================================
   INPUT
========================================================= */

function handleInput(){

  const input =
    document.getElementById('q');

  const q =
    input.value.trim();

  searchGeneration++;

  const generation =
    searchGeneration;

  clearTimeout(suggestionTimer);

  suggestionIndex = -1;

  if(suggestionController){

    suggestionController.abort();
    suggestionController = null;
  }

  if(!q || q.length < 2){

    hideSuggestions();
    return;
  }

  /*
     Lokálne návrhy zobrazíme okamžite.
     Serverové reálne karty ich následne nahradia.
  */

  const localItems =
    buildLocalSuggestions(q);

  if(localItems.length){

    suggestionItems =
      localItems;

    renderSuggestions();

  }else{

    showSuggestionsLoading();

  }

  /*
     Server voláme s debounce.
  */

  suggestionTimer =
    setTimeout(
      () => {

        if(
          generation !==
          searchGeneration
        ){
          return;
        }

        loadSuggestions(
          q,
          generation
        );

      },
      350
    );
}


/* =========================================================
   LOAD SUGGESTIONS
========================================================= */

async function loadSuggestions(q,generation){

  if(
    generation !==
    searchGeneration
  ){
    return;
  }

  const cacheKey =
    q.toLowerCase().trim();

  const cached =
    suggestionCache.get(cacheKey);

  if(
    cached &&
    Date.now() - cached.time <
    SUGGESTION_CACHE_TTL
  ){

    suggestionItems =
      mergeSuggestions(
        cached.items,
        []
      );

    renderSuggestions();

    /*
       Ak cache nemá obrázky,
       doplníme ich z reálneho searchu.
    */

    if(
      suggestionItems.length &&
      suggestionItems.some(
        item => !getResultImage(item)
      )
    ){

      enrichSuggestionImages(
        q,
        generation
      );
    }

    return;
  }


  suggestionController =
    new AbortController();


  try{

    /*
       1. Najprv rýchly autocomplete endpoint.
    */

    const suggestionResponse =
      await fetch(
        '/api/suggestions?q=' +
        encodeURIComponent(q),
        {
          cache:'no-store',
          signal:suggestionController.signal
        }
      );


    let serverItems = [];


    if(suggestionResponse.ok){

      const data =
        await suggestionResponse.json();

      if(
        Array.isArray(
          data.suggestions
        )
      ){

        serverItems =
          data.suggestions;
      }
    }


    /*
       2. Ak suggestions nič nevrátili,
          použijeme normálne vyhľadávanie.
    */

    if(
      serverItems.length === 0 &&
      q.length >= 3
    ){

      const searchResponse =
        await fetch(
          '/api/search?q=' +
          encodeURIComponent(q),
          {
            cache:'no-store',
            signal:suggestionController.signal
          }
        );


      if(searchResponse.ok){

        const searchData =
          await searchResponse.json();

        if(
          Array.isArray(
            searchData.results
          )
        ){

          serverItems =
            searchData.results;
        }
      }
    }


    if(
      generation !==
      searchGeneration
    ){
      return;
    }


    /*
       Uložíme reálne návrhy do cache.
    */

    suggestionCache.set(
      cacheKey,
      {
        time:Date.now(),
        items:serverItems
      }
    );


    /*
       DÔLEŽITÉ:
       Serverové návrhy majú prednosť.
       Lokálne návrhy už nemiešame medzi
       reálne karty.
    */

    suggestionItems =
      mergeSuggestions(
        serverItems,
        []
      );


    suggestionIndex = -1;

    renderSuggestions();


    /*
       Ak CardyX suggestions nemajú obrázky,
       doplníme ich z /api/search.
    */

    if(
      suggestionItems.length &&
      suggestionItems.some(
        item => !getResultImage(item)
      )
    ){

      enrichSuggestionImages(
        q,
        generation
      );
    }

  }
  catch(error){

    if(
      error &&
      error.name === 'AbortError'
    ){
      return;
    }

    console.error(
      'Autocomplete error:',
      error
    );


    /*
       Pri chybe zobrazíme aspoň lokálne
       návrhy.
    */

    suggestionItems =
      buildLocalSuggestions(q);

    if(suggestionItems.length){

      renderSuggestions();

    }else{

      hideSuggestions();
    }

  }
  finally{

    if(
      generation ===
      searchGeneration
    ){

      suggestionController =
        null;
    }
  }
}


/* =========================================================
   ENRICH SUGGESTION IMAGES
   Doplní obrázky z normálneho /api/search
========================================================= */

async function enrichSuggestionImages(q,generation){

  if(
    generation !==
    searchGeneration
  ){
    return;
  }

  try{

    const response =
      await fetch(
        '/api/search?q=' +
        encodeURIComponent(q),
        {
          cache:'no-store'
        }
      );


    if(!response.ok){
      return;
    }


    const data =
      await response.json();


    if(
      !Array.isArray(
        data.results
      )
    ){
      return;
    }


    if(
      generation !==
      searchGeneration
    ){
      return;
    }


    const results =
      data.results;


    suggestionItems =
      suggestionItems.map(
        suggestion => {

          if(
            getResultImage(
              suggestion
            )
          ){
            return suggestion;
          }


          const suggestionTitle =
            String(
              suggestion.title ||
              ''
            )
            .toLowerCase()
            .trim();


          const suggestionQuery =
            String(
              suggestion.query ||
              ''
            )
            .toLowerCase()
            .trim();


          let match =
            results.find(
              result => {

                const resultTitle =
                  String(
                    result.title ||
                    ''
                  )
                  .toLowerCase()
                  .trim();


                const resultQuery =
                  String(
                    result.query ||
                    ''
                  )
                  .toLowerCase()
                  .trim();


                return (
                  (
                    resultTitle &&
                    suggestionTitle &&
                    resultTitle ===
                    suggestionTitle
                  ) ||
                  (
                    resultQuery &&
                    suggestionQuery &&
                    resultQuery ===
                    suggestionQuery
                  )
                );

              }
            );


          /*
             Keď presná zhoda neexistuje,
             skúsime podľa linku.
          */

          if(
            !match &&
            suggestion.link
          ){

            match =
              results.find(
                result =>
                  result.link &&
                  result.link ===
                  suggestion.link
              );
          }


          if(!match){
            return suggestion;
          }


          const image =
            getResultImage(match);


          const price =
            getResultPrice(
              suggestion
            );


          return {

            ...suggestion,

            image:
              image ||
              suggestion.image ||
              '',

            price_eur:
              price !== null
                ? price
                : getResultPrice(match)

          };

        }
      );


    /*
       Uložíme obohatené výsledky aj do cache.
    */

    const cacheKey =
      q.toLowerCase().trim();

    suggestionCache.set(
      cacheKey,
      {
        time:Date.now(),
        items:suggestionItems
      }
    );


    renderSuggestions();


  }
  catch(error){

    console.warn(
      'Image enrichment failed:',
      error
    );

  }
}


/* =========================================================
   LOADING
========================================================= */

function showSuggestionsLoading(){

  const box =
    document.getElementById(
      'suggestions'
    );

  box.innerHTML =
    '<div class="suggestions-loading">' +
    '🔎 Hľadám konkrétne karty...' +
    '</div>';

  box.classList.add('show');
}


/* =========================================================
   ICON
========================================================= */

function suggestionIcon(item){

  const type =
    String(item?.type || '').toLowerCase();

  if(type === 'product'){
    return '📦';
  }

  if(type === 'set'){
    return '📦';
  }

  if(type === 'pokemon'){
    return '⚡';
  }

  return '🃏';
}


/* =========================================================
   RENDER AUTOCOMPLETE
========================================================= */

function renderSuggestions(){

  const box =
    document.getElementById(
      'suggestions'
    );

  if(!suggestionItems.length){

    box.innerHTML =
      '<div class="suggestions-empty">' +
      'Žiadny návrh.' +
      '</div>';

    box.classList.add('show');

    return;
  }


  box.innerHTML =
    suggestionItems.map(
      (item,index) => {

        const title =
          esc(item.title || '');

        const imageUrl =
          getResultImage(item);

        const price =
          getResultPrice(item);


        const priceHtml =
          price !== null

          ? `
            <div class="suggestion-price-wrap">
              <span class="suggestion-price">
                ${eur(price)}
              </span>
            </div>
          `

          : `
            <div class="suggestion-price-wrap">
              <span class="suggestion-price">
                —
              </span>
            </div>
          `;


        const imageHtml =
          imageUrl

          ? `
            <img
              class="suggestion-image"
              src="${esc(imageUrl)}"
              alt="${title}"
              loading="lazy"
              onerror="
                this.style.display='none';
                const p=this.parentElement.querySelector('.suggestion-image-placeholder');
                if(p)p.style.display='flex';
              "
            >

            <div
              class="suggestion-image-placeholder"
              style="display:none;"
            >
              🃏
            </div>
          `

          : `
            <div class="suggestion-image-placeholder">
              ${suggestionIcon(item)}
            </div>
          `;


        return `
          <div
            class="suggestion"
            data-index="${index}"
            onclick="chooseSuggestionByIndex(${index})"
          >

            <div class="suggestion-image-wrap">
              ${imageHtml}
            </div>

            <div class="suggestion-main">

              <div class="suggestion-title">
                ${title}
              </div>

            </div>

            ${priceHtml}

          </div>
        `;
      }
    ).join('');


  box.classList.add('show');

  renderActiveSuggestion();
}


/* =========================================================
   ACTIVE
========================================================= */

function renderActiveSuggestion(){

  const rows =
    document.querySelectorAll(
      '.suggestion'
    );

  rows.forEach(
    (row,index) => {

      row.classList.toggle(
        'active',
        index === suggestionIndex
      );

    }
  );

  const active =
    document.querySelector(
      '.suggestion.active'
    );

  if(active){

    active.scrollIntoView({
      block:'nearest'
    });
  }
}


/* =========================================================
   KEYBOARD
========================================================= */

function handleKeydown(event){

  const box =
    document.getElementById(
      'suggestions'
    );

  const visible =
    box.classList.contains('show');


  if(
    event.key === 'ArrowDown' &&
    visible
  ){

    event.preventDefault();

    if(!suggestionItems.length){
      return;
    }

    suggestionIndex++;

    if(
      suggestionIndex >=
      suggestionItems.length
    ){

      suggestionIndex = 0;
    }

    renderActiveSuggestion();

    return;
  }


  if(
    event.key === 'ArrowUp' &&
    visible
  ){

    event.preventDefault();

    if(!suggestionItems.length){
      return;
    }

    suggestionIndex--;

    if(suggestionIndex < 0){

      suggestionIndex =
        suggestionItems.length - 1;
    }

    renderActiveSuggestion();

    return;
  }


  if(event.key === 'Enter'){

    event.preventDefault();

    if(
      visible &&
      suggestionIndex >= 0 &&
      suggestionItems[
        suggestionIndex
      ]
    ){

      chooseSuggestion(
        suggestionItems[
          suggestionIndex
        ]
      );

    }else{

      search();

    }

    return;
  }


  if(event.key === 'Escape'){

    hideSuggestions();

  }
}


/* =========================================================
   CHOOSE
========================================================= */

function chooseSuggestionByIndex(index){

  if(
    !suggestionItems[index]
  ){
    return;
  }

  chooseSuggestion(
    suggestionItems[index]
  );
}


function chooseSuggestion(item){

  const value =
    item.query ||
    item.title ||
    '';

  searchGeneration++;

  clearTimeout(
    suggestionTimer
  );

  if(suggestionController){

    suggestionController.abort();
    suggestionController = null;
  }

  document.getElementById('q').value =
    value;

  hideSuggestions();

  search();
}


/* =========================================================
   HIDE
========================================================= */

function hideSuggestions(){

  const box =
    document.getElementById(
      'suggestions'
    );

  box.classList.remove('show');
  box.innerHTML = '';

  suggestionItems = [];
  suggestionIndex = -1;
}


/* =========================================================
   QUICK TAG
========================================================= */

function tag(value){

  document.getElementById('q').value =
    value;

  hideSuggestions();

  search();
}


/* =========================================================
   RESULT IMAGE
========================================================= */

function renderResultImage(item){

  const imageUrl =
    getResultImage(item);

  const title =
    esc(
      item?.title ||
      'Pokémon produkt'
    );

  const link =
    item?.link
      ? esc(item.link)
      : '';


  if(!imageUrl){

    return `
      <div class="offer-image-wrap">

        <div class="offer-image-placeholder">

          <div class="offer-image-placeholder-icon">
            🃏
          </div>

          <div>
            Obrázok<br>
            nie je dostupný
          </div>

        </div>

      </div>
    `;
  }


  const imageHtml = `
    <img
      class="offer-image"
      src="${esc(imageUrl)}"
      alt="${title}"
      loading="lazy"
      onerror="
        this.style.display='none';
        const p=this.parentElement.querySelector('.image-fallback');
        if(p)p.style.display='flex';
      "
    >
  `;

  const fallbackHtml = `
    <div
      class="offer-image-placeholder image-fallback"
      style="display:none;"
    >
      <div class="offer-image-placeholder-icon">
        🃏
      </div>
      <div>
        Obrázok<br>
        nedostupný
      </div>
    </div>
  `;


  if(link){

    return `
      <div class="offer-image-wrap">

        <a
          class="offer-image-link"
          href="${link}"
          target="_blank"
          rel="noopener noreferrer"
        >

          ${imageHtml}
          ${fallbackHtml}

        </a>

      </div>
    `;
  }


  return `
    <div class="offer-image-wrap">

      ${imageHtml}
      ${fallbackHtml}

    </div>
  `;
}


/* =========================================================
   PRICE HTML
========================================================= */

function renderPrice(item){

  const price =
    getResultPrice(item);

  if(price === null){

    return `
      <div class="price price-missing">
        Cena nezistená
      </div>
    `;
  }

  return `
    <div class="price">
      ${eur(price)}
    </div>
  `;
}


function getPricedResults(results){

  return results.filter(
    item =>
      getResultPrice(item) !== null
  );
}


function getCheapestIndex(results){

  let index = -1;
  let best = Infinity;

  results.forEach(
    (item,i) => {

      const price =
        getResultPrice(item);

      if(
        price !== null &&
        price < best
      ){

        best = price;
        index = i;
      }
    }
  );

  return index;
}


/* =========================================================
   TYPE
========================================================= */

function detectFrontendType(item){

  if(
    item.product_type &&
    item.product_type !== 'card'
  ){
    return 'Produkt';
  }

  const title =
    String(
      item.title || ''
    ).toLowerCase();

  if(
    title.includes('elite trainer box') ||
    /\betb\b/.test(title) ||
    title.includes('booster box') ||
    title.includes('booster bundle') ||
    title.includes('collection box') ||
    title.includes('premium collection') ||
    title.includes('blister') ||
    /\btin\b/.test(title)
  ){

    return 'Produkt';
  }

  return 'Karta';
}


/* =========================================================
   SUMMARY
========================================================= */

function renderCompactSummary(
  query,
  results,
  summary
){

  const total =
    Array.isArray(results)
      ? results.length
      : 0;

  const priced =
    Array.isArray(results)
      ? getPricedResults(results)
      : [];

  let lowest = null;

  priced.forEach(
    item => {

      const price =
        getResultPrice(item);

      if(
        price !== null &&
        (
          lowest === null ||
          price < lowest
        )
      ){

        lowest = price;
      }
    }
  );


  let average = null;

  if(
    summary &&
    summary.average_eur !== null &&
    summary.average_eur !== undefined
  ){

    average =
      Number(
        summary.average_eur
      );
  }


  if(
    lowest === null &&
    !total
  ){

    return '';
  }


  return `
    <div class="result-summary">

      <strong>
        ${esc(query)}
      </strong>

      <span class="separator">·</span>

      <span>
        ${total} ponúk
      </span>

      ${
        priced.length
        ? `
          <span class="separator">·</span>

          <span>
            od
            <span class="summary-price">
              ${eur(lowest)}
            </span>
          </span>
        `
        : ''
      }

      ${
        average !== null &&
        Number.isFinite(average)
        ? `
          <span class="separator">·</span>

          <span>
            priemer
            <span class="summary-price">
              ${eur(average)}
            </span>
          </span>
        `
        : ''
      }

    </div>
  `;
}


/* =========================================================
   RESULTS
========================================================= */

function renderResults(results){

  const el =
    document.getElementById(
      'results'
    );


  if(
    !Array.isArray(results) ||
    !results.length
  ){

    el.innerHTML =
      '<div class="empty">' +
      'Nenašiel som čitateľnú ponuku. ' +
      'Obchod mohol zmeniť stránku alebo ' +
      'vyhľadávanie nič nenašlo.' +
      '</div>';

    return;
  }


  const sortedResults =
    [...results].sort(
      (a,b) => {

        const priceA =
          getResultPrice(a);

        const priceB =
          getResultPrice(b);

        if(
          priceA === null &&
          priceB === null
        ){
          return 0;
        }

        if(priceA === null){
          return 1;
        }

        if(priceB === null){
          return -1;
        }

        return priceA - priceB;
      }
    );


  const cheapestIndex =
    getCheapestIndex(
      sortedResults
    );


  const pricedCount =
    getPricedResults(
      sortedResults
    ).length;


  el.innerHTML = `

    <div class="offers-panel">

      <div class="offers-heading">

        <div class="offers-heading-title">
          Aktuálne ponuky
        </div>

        <div class="offers-heading-sub">
          ${sortedResults.length}
          ponúk ·
          ${pricedCount}
          s cenou
        </div>

      </div>

      ${
        sortedResults.map(
          (x,i) => {

            const productType =
              detectFrontendType(x);

            const typeBadge =
              `
                <span class="badge ${
                  productType === 'Karta'
                    ? 'type-card'
                    : 'type-product'
                }">
                  ${esc(productType)}
                </span>
              `;

            const isCheapest =
              i === cheapestIndex;


            return `

              <div class="offer">

                ${renderResultImage(x)}

                <div class="offer-main">

                  <div class="offer-title">
                    ${esc(x.title || '')}
                  </div>

                  <div class="offer-meta">

                    ${typeBadge}

                    ${
                      x.shop
                      ? `
                        <span class="badge">
                          ${esc(x.shop)}
                        </span>
                      `
                      : ''
                    }

                    ${
                      x.country
                      ? `
                        <span class="badge">
                          ${esc(x.country)}
                        </span>
                      `
                      : ''
                    }

                    ${
                      x.condition
                      ? `
                        <span class="badge">
                          ${esc(x.condition)}
                        </span>
                      `
                      : ''
                    }

                    ${
                      isCheapest
                      ? `
                        <span class="badge best">
                          NAJNIŽŠIA CENA
                        </span>
                      `
                      : ''
                    }

                  </div>

                </div>

                <div class="offer-price">

                  ${renderPrice(x)}

                  ${
                    x.link
                    ? `
                      <a
                        class="buy"
                        href="${esc(x.link)}"
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        Otvoriť ponuku ↗
                      </a>
                    `
                    : ''
                  }

                </div>

              </div>

            `;
          }
        ).join('')
      }

    </div>

  `;
}


/* =========================================================
   SEARCH
========================================================= */

async function search(){

  searchGeneration++;

  clearTimeout(
    suggestionTimer
  );

  suggestionTimer = null;

  if(suggestionController){

    suggestionController.abort();
    suggestionController = null;
  }

  hideSuggestions();


  const status =
    document.getElementById(
      'status'
    );

  const results =
    document.getElementById(
      'results'
    );

  const button =
    document.getElementById(
      'searchButton'
    );

  let stage =
    'začiatok';


  try{

    stage =
      'čítanie vyhľadávania';


    const input =
      document.getElementById(
        'q'
      );

    const q =
      input.value.trim();


    if(!q){
      return;
    }


    button.disabled = true;


    status.innerHTML =
      '<div class="loading">' +
      '🔎 Overujem aktuálne ponuky...' +
      '</div>';

    results.innerHTML = '';


    stage =
      'odosielanie požiadavky';


    const apiUrl =
      '/api/search?q=' +
      encodeURIComponent(q);


    const response =
      await fetch(
        apiUrl,
        {
          cache:'no-store'
        }
      );


    stage =
      'čítanie odpovede';


    const responseText =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(
          responseText
        );

    }
    catch(error){

      throw new Error(
        'Server neposlal platný JSON. ' +
        'HTTP ' +
        response.status +
        '. Začiatok odpovede: ' +
        responseText.substring(0,500)
      );
    }


    if(!response.ok){

      throw new Error(
        data.error ||
        'Chyba pri vyhľadávaní.'
      );
    }


    stage =
      'spracovanie výsledkov';


    const normalized =
      data.normalized_query ||
      data.normalized ||
      '';


    if(
      normalized &&
      normalized.trim() &&
      normalized.toLowerCase() !==
      q.toLowerCase()
    ){

      input.value =
        normalized;
    }


    const resultData =
      Array.isArray(data.results)
        ? data.results
        : [];


    status.innerHTML =
      renderCompactSummary(
        normalized || q,
        resultData,
        data.summary
      );


    renderResults(
      resultData
    );


    hideSuggestions();


    console.log(
      'CardRadar search OK:',
      q,
      data
    );

  }
  catch(error){

    console.error(
      'CardRadar chyba:',
      stage,
      error
    );


    status.innerHTML = `

      <div class="panel error">

        <b>Chyba v kroku:</b>
        ${esc(stage)}

        <br><br>

        <b>Typ:</b>
        ${esc(
          error?.name ||
          'Unknown'
        )}

        <br>

        <b>Správa:</b>
        ${esc(
          error?.message ||
          'Neznáma chyba.'
        )}

      </div>

    `;

    results.innerHTML = '';

  }
  finally{

    button.disabled = false;

  }
}


/* =========================================================
   CLICK OUTSIDE
========================================================= */

document.addEventListener(
  'click',
  event => {

    const wrap =
      document.querySelector(
        '.search-wrap'
      );

    if(
      wrap &&
      !wrap.contains(event.target)
    ){

      hideSuggestions();

    }
  }
);


/* =========================================================
   URL QUERY
========================================================= */

try{

  const initialQuery =
    new URLSearchParams(
      window.location.search
    ).get('q');

  if(initialQuery){

    document.getElementById(
      'q'
    ).value =
      initialQuery;

    search();
  }

}
catch(error){

  console.error(
    'Initial URL error:',
    error
  );

}
