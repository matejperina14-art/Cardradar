<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CardRadar 🔍 – reálne ceny Pokémon kariet</title>
<style>
:root{--bg:#090d16;--panel:#1e293b;--input:#0f172a;--text:#f8fafc;--sub:#94a3b8;--border:#334155;--accent:#facc15}
*{box-sizing:border-box}body{margin:0;padding:22px 14px;min-height:100vh;background:linear-gradient(135deg,#090d16,#0f172a,#172033);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto}h1{text-align:center;color:var(--accent);font-size:2.3rem;margin:10px 0 4px}.sub{text-align:center;color:var(--sub);margin-bottom:22px}.search{display:flex;gap:8px;background:#1e293bcc;padding:8px;border:1px solid var(--border);border-radius:14px}.search input{flex:1}.input,select,button{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:9px;padding:11px 13px;font-size:15px}button.primary{background:var(--accent);color:#111827;font-weight:800;border:0}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tags button{padding:7px 10px;font-size:13px}.panel{background:#1e293bcc;border:1px solid var(--border);border-radius:14px;padding:16px;margin:14px 0}.preview{display:flex;gap:15px;align-items:center}.preview img{width:90px;border-radius:9px}.muted{color:var(--sub)}.offer{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}.offer:last-child{border-bottom:0}.price{font-size:1.3rem;color:#4ade80;font-weight:800;white-space:nowrap}.buy{display:inline-block;margin-top:7px;background:var(--accent);color:#111827;text-decoration:none;font-weight:800;padding:7px 10px;border-radius:7px;font-size:13px}.badge{font-size:12px;background:#334155;padding:3px 7px;border-radius:5px;margin-right:4px}.best{background:#16a34a;color:white}.loading{text-align:center;padding:30px;color:var(--sub)}.error{color:#fda4af}.empty{text-align:center;padding:30px;color:var(--sub)}@media(max-width:650px){.search{flex-direction:column}.offer{align-items:flex-start;flex-direction:column}.price{text-align:left}.preview{align-items:flex-start}}
</style>
</head>
<body><div class="wrap">
<h1>CardRadar 🔍</h1>
<div class="sub">Porovnanie reálnych cien Pokémon kariet a produktov SK & CZ</div>
<div class="search"><input id="q" class="input" placeholder="Charizard VMAX, Surging Sparks ETB..." onkeydown="if(event.key==='Enter')search()"><button class="primary" onclick="search()">Hľadať</button></div>
<div class="tags"><button onclick="tag('Charizard VMAX')">Charizard VMAX</button><button onclick="tag('Pikachu ex')">Pikachu ex</button><button onclick="tag('Surging Sparks ETB')">Surging Sparks ETB</button><button onclick="tag('Umbreon VMAX')">Umbreon VMAX</button></div>
<div id="status"></div><div id="preview" class="panel" style="display:none"></div><div id="results"></div>
</div>
<script>
const eur=(n)=>Number(n).toFixed(2)+' €';
function tag(x){document.getElementById('q').value=x;search()}
async function search(){
 const q=document.getElementById('q').value.trim(); if(!q)return;
 history.replaceState({},'',`?q=${encodeURIComponent(q)}`);
 document.getElementById('status').innerHTML='<div class="loading">🔎 Overujem aktuálne ponuky v obchodoch...</div>';
 document.getElementById('results').innerHTML=''; document.getElementById('preview').style.display='none';
 try{
  const r=await fetch('/api/search?q='+encodeURIComponent(q)); const d=await r.json();
  if(!r.ok) throw new Error(d.error||'Chyba');
  if(d.info && (d.info.image||d.info.title)){
   const p=document.getElementById('preview');p.style.display='block';
   p.innerHTML=`<div class="preview">${d.info.image?`<img src="${d.info.image}">`:''}<div><h2>${esc(d.info.title||q)}</h2><div class="muted">${esc(d.info.subtitle||'')}</div></div></div>`;
  }
  document.getElementById('status').innerHTML=`<div class="panel"><b>Nájdených reálnych ponúk: ${d.results.length}</b><div class="muted">Kurz CZK/EUR: ${d.czk_per_eur}</div></div>`;
  const el=document.getElementById('results');
  if(!d.results.length){el.innerHTML='<div class="empty">Nenašiel som čitateľnú ponuku. Obchod mohol zmeniť stránku alebo vyhľadávanie nič nenašlo.</div>';return}
  el.innerHTML='<div class="panel"><h3>Aktuálne ponuky</h3>'+d.results.map((x,i)=>`<div class="offer"><div><div><b>${esc(x.title)}</b></div><div style="margin-top:6px"><span class="badge">${esc(x.shop)}</span><span class="badge">${x.country}</span><span class="badge">${x.condition}</span>${i===0?'<span class="badge best">TOP CENA</span>':''}</div></div><div><div class="price">${eur(x.price_eur)}</div><a class="buy" href="${x.link}" target="_blank" rel="noopener">Otvoriť ponuku ↗</a></div></div>`).join('')+'</div>';
 }catch(e){document.getElementById('status').innerHTML='<div class="panel error">Chyba: '+esc(e.message)+'</div>'}
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
const q=new URLSearchParams(location.search).get('q');if(q){document.getElementById('q').value=q;search()}
</script></body></html>
